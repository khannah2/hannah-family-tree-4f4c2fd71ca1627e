g.node{cursor:pointer}g.node.sel path,g.node.sel polygon{stroke:#e08000!important;stroke-width:4px!important}
#panel{position:fixed;top:52px;right:0;bottom:0;width:380px;max-width:100%;background:#fff;box-shadow:-3px 0 12px #0003;padding:14px 16px 30px;overflow:auto;transform:translateX(105%);transition:transform .2s;z-index:4}
#panel.open{transform:none}#panel h2{margin:0 30px 4px 0;font-size:20px}

#panel h3{font-size:13px;text-transform:uppercase;color:#667;margin:14px 0 4px}
#panel a.p{color:#1a56b0;cursor:pointer;text-decoration:underline}
#panel ul{margin:0;padding-left:18px}#panel li{margin:3px 0}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.confirmed{background:#d6f5d6;color:#145214}.probable{background:#fff1c2;color:#7a5600}.tree{background:#ffdcd6;color:#8a2010}
.note{white-space:pre-wrap;font-size:14px;line-height:1.4}.src a{word-break:break-all;font-size:13px}
#legend{position:fixed;left:8px;bottom:8px;background:#fffd;border:1px solid #ccc;border-radius:6px;padding:6px 8px;font-size:12px;z-index:3}
#legend span{display:inline-block;width:14px;height:10px;border:1px solid #555;margin:0 3px 0 8px;vertical-align:middle}
@media(max-width:600px){#bar h1{display:none}#panel{width:100%;top:auto;height:62%;transform:translateY(105%)}#panel.open{transform:none}#legend{font-size:10px}}

const svg=document.getElementById('tree'),view=document.getElementById('view');
const vb0=svg.viewBox.baseVal;const W0=vb0.width,H0=vb0.height;
let vb={x:vb0.x,y:vb0.y,w:W0,h:H0};
function apply(){svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`)}
function scaleNow(){const r=view.getBoundingClientRect();return Math.min(r.width/vb.w,r.height/vb.h)}
function zoomAt(f,cx,cy){const r=view.getBoundingClientRect();const s=scaleNow();
 const px=vb.x+(cx-r.left-(r.width-vb.w*s)/2)/s, py=vb.y+(cy-r.top-(r.height-vb.h*s)/2)/s;
 const nw=Math.max(80,Math.min(W0*4,vb.w/f)),k=nw/vb.w; vb.x=px-(px-vb.x)*k; vb.y=py-(py-vb.y)*k; vb.w=nw; vb.h=vb.h*k; apply()}
function centerOn(id,width){const g=document.getElementById(id);if(!g)return;const b=g.getBBox();
 const r=view.getBoundingClientRect();const w=width||900;vb.w=w;vb.h=w*r.height/r.width;vb.x=b.x+b.width/2-vb.w/2;vb.y=b.y+b.height/2-vb.h/2;if(r.width>600)vb.x+=190*vb.w/r.width;apply()}
view.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
const ptrs=new Map();let last=null,pinch=null,moved=0;
view.addEventListener('pointerdown',e=>{view.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=0;view.classList.add('drag');
 if(ptrs.size==2){const p=[...ptrs.values()];pinch=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1])}});
view.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const o=ptrs.get(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptrs.size==2&&pinch){const p=[...ptrs.values()];const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);zoomAt(d/pinch,(p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2);pinch=d;moved+=10;return}
 const s=scaleNow(),dx=e.clientX-o[0],dy=e.clientY-o[1];moved+=Math.abs(dx)+Math.abs(dy);vb.x-=dx/s;vb.y-=dy/s;apply()});
function up(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size)view.classList.remove('drag')}
view.addEventListener('pointerup',e=>{const wasClick=moved<6;up(e);if(wasClick){const t=document.elementFromPoint(e.clientX,e.clientY);const g=t&&t.closest('g.node');if(g&&D[g.id])show(g.id)}});
view.addEventListener('pointercancel',up);
document.getElementById('zin').onclick=()=>{const r=view.getBoundingClientRect();zoomAt(1.3,r.left+r.width/2,r.top+r.height/2)};
document.getElementById('zout').onclick=()=>{const r=view.getBoundingClientRect();zoomAt(1/1.3,r.left+r.width/2,r.top+r.height/2)};
document.getElementById('reset').onclick=()=>{centerOn('I29');show('I29')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const link=id=>id&&D[id]?`<a class="p" data-id="${id}">${esc(D[id].name)}${D[id].nick?' “'+esc(D[id].nick)+'”':''}</a>`:'<i>unknown</i>';
const ST={confirmed:'Confirmed',probable:'Probable',tree:'FamilySearch shared tree (unverified)'};
function show(id){const p=D[id];document.querySelectorAll('g.node.sel').forEach(g=>g.classList.remove('sel'));const g=document.getElementById(id);if(g)g.classList.add('sel');
 let h=`<h2>${esc(p.name)}</h2>`;if(p.nick)h+=`<div>Nickname: <b>${esc(p.nick)}</b></div>`;
 h+=`<div style="margin-top:6px"><span class="badge ${p.status}">${ST[p.status]}</span>${p.probchild?' <span class="badge probable">probable parent link</span>':''}${p.living?' <span class="badge" style="background:#eee">living (names only)</span>':''}</div>`;
 if(p.ev.length)h+='<h3>Life events</h3><ul>'+p.ev.map(e=>`<li><b>${e[0]}</b> ${esc(e[1])}${e[2]?' — '+esc(e[2]):''}</li>`).join('')+'</ul>';
 h+='<h3>Parents</h3>'+(p.parents.length?'<ul>'+p.parents.map(x=>'<li>'+link(x)+'</li>').join('')+'</ul>':'<i>none recorded</i>');
 h+='<h3>Spouses</h3>'+(p.spouses.length?'<ul>'+p.spouses.map(s=>'<li>'+link(s.id)+(s.marr?` — m. ${esc(s.marr[0])}${s.marr[1]?', '+esc(s.marr[1]):''}`:'')+(s.note?`<div style="font-size:12px;color:#555">${esc(s.note)}</div>`:'')+'</li>').join('')+'</ul>':'<i>none recorded</i>');
 h+='<h3>Children</h3>'+(p.children.length?'<ul>'+p.children.map(x=>'<li>'+link(x)+'</li>').join('')+'</ul>':'<i>none recorded</i>');
 h+=`<h3>Notes</h3><div class="note">${esc(p.note)}</div>`;
 h+='<h3>Sources</h3>'+(p.src.length?'<ul class="src">'+p.src.map(s=>/^https?:/.test(s)?`<li><a href="${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a></li>`:`<li>${esc(s)}</li>`).join('')+'</ul>':'<i>Keith Hannah (family knowledge)</i>');
 document.getElementById('pc').innerHTML=h;document.getElementById('panel').classList.add('open')}
document.getElementById('pc').addEventListener('click',e=>{const a=e.target.closest('a.p');if(a){centerOn(a.dataset.id,vb.w);show(a.dataset.id)}});
document.getElementById('close').onclick=()=>document.getElementById('panel').classList.remove('open');
const q=document.getElementById('q'),res=document.getElementById('results');
q.addEventListener('input',()=>{const t=q.value.trim().toLowerCase();if(!t){res.style.display='none';return}
 const m=Object.entries(D).filter(([k,v])=>(v.name+' '+(v.nick||'')).toLowerCase().includes(t)).slice(0,30);
 res.innerHTML=m.length?m.map(([k,v])=>`<div data-id="${k}">${esc(v.name)}${v.nick?' “'+esc(v.nick)+'”':''}</div>`).join(''):'<div>No match</div>';res.style.display='block'});
res.addEventListener('click',e=>{const d=e.target.closest('div[data-id]');if(d){centerOn(d.dataset.id,700);show(d.dataset.id);res.style.display='none';q.value=''}});
document.querySelectorAll('g.node title').forEach(t=>t.remove());
window.addEventListener('load',()=>{centerOn('I29',window.innerWidth<600?500:1100);show('I29')});
